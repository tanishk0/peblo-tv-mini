name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: 'cms/package-lock.json' }
      - run: pip install -r backend/requirements.txt
      - run: ruff check backend
      - run: npm ci
        working-directory: cms
      - run: npm run lint
        working-directory: cms
      - run: npm run build
        working-directory: cms
      - run: npm ci
        working-directory: viewer
      - run: npm run lint
        working-directory: viewer
      - run: npm run build
        working-directory: viewer

  tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install -r backend/requirements.txt
      - run: pytest -q
        working-directory: backend

  docker-build:
    runs-on: ubuntu-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - run: docker compose build

  deployment-plan:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Document production deployment hand-off
        run: |
          echo "No cloud deployment is performed by this assessment repository."
          echo "A production workflow would authenticate with the target registry using CI secrets, push the images built above, then deploy immutable image digests after a health check."
          echo "Runtime secrets belong in the deployment platform's secret manager, never in this repository or image."
