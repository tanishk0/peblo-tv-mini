services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-peblo_tv_mini}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-peblo_tv_mini}
      SECRET_KEY: ${SECRET_KEY:-peblo-tv-mini-local-development-secret-key}
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:5174"]'
      LOCAL_ARTWORK_STORAGE_DIR: /data/artwork
      LOCAL_CATALOGUE_STORAGE_DIR: /data/catalogues
      SEED_ASSETS_DIR: /seed-assets
    volumes:
      - backend_data:/data
      - ./assets:/seed-assets:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 6

  cms:
    build:
      context: ./cms
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:80"

  viewer:
    build:
      context: ./viewer
      args:
        VITE_CATALOGUE_API_URL: http://localhost:8000/api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5174:80"

volumes:
  postgres_data:
  backend_data:
